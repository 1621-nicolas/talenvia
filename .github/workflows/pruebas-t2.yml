name: T2 - Navegador y rendimiento
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  navegador:
    name: Funcionales Playwright
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      DB_ENGINE: sqlite
      DJANGO_DEBUG: "true"
      BASE_URL: http://127.0.0.1:8000
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Instalar Django y Playwright
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-t2.txt
          python -m playwright install --with-deps chromium
      - name: Ejecutar interfaz en base de pruebas aislada
        run: |
          python manage.py migrate --noinput
          python manage.py sembrar_demo --confirmar
          python manage.py runserver --noreload 127.0.0.1:8000 > server-ui.log 2>&1 &
          for i in {1..40}; do
            if curl -fsS -o /dev/null http://127.0.0.1:8000/; then break; fi
            sleep 1
          done
          python -m unittest discover -s pruebas/ui -p 'test_*.py' -v
      - name: Adjuntar capturas y logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: evidencias-t2-playwright
          path: |
            resultados/t2/ui/
            server-ui.log
          if-no-files-found: ignore

  rendimiento:
    name: Carga basica k6
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      DB_ENGINE: sqlite
      DJANGO_DEBUG: "true"
      BASE_URL: http://127.0.0.1:8000
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Instalar Django
        run: python -m pip install -r requirements.txt
      - name: Preparar base DEMO y servidor de pruebas
        run: |
          python manage.py migrate --noinput
          python manage.py sembrar_demo --confirmar
          python manage.py runserver --noreload 127.0.0.1:8000 > server-k6.log 2>&1 &
          for i in {1..40}; do
            if curl -fsS -o /dev/null http://127.0.0.1:8000/; then break; fi
            sleep 1
          done
      - name: Instalar k6
        uses: grafana/setup-k6-action@v1
      - name: Prueba de carga local controlada
        run: |
          mkdir -p resultados/t2
          k6 run --summary-export resultados/t2/k6-t2.json pruebas/rendimiento/t2_carga.js
      - name: Adjuntar resultado de rendimiento y logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: evidencias-t2-k6
          path: |
            resultados/t2/k6-t2.json
            server-k6.log
          if-no-files-found: ignore
